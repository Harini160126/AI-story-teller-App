services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: storyverse
      POSTGRES_USER: storyverse
      POSTGRES_PASSWORD: storyverse
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    env_file: ./backend/.env.example
    depends_on: [db]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  pgdata:
